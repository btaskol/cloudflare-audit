name: Cloudflare Security Posture Audit

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write # 👈 Necesario para que el script pueda guardar y subir el reporte al repo

jobs:
  audit-cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: pip install requests

      - name: 🔍 Ejecutar auditoría de Cloudflare con IA
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }} # Tu API Key gratuita de Groq
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub
        run: python audit_cloudflare.py
