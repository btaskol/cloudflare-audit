name: Cloudflare Security Posture Audit

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  audit-cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: pip install requests

      - name: 🔍 Ejecutar auditoría de Cloudflare
        id: run_audit
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python audit_cloudflare.py

      - name: 📧 Enviar reporte a Gmail
        # Esta acción oficial envía correos vía SMTP (puedes usar una App Password de Gmail)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Reporte Diario - Auditoría Cloudflare Worker 🛡️"
          body: "La auditoría diaria de tu Cloudflare Worker (billing-receipt-system) se ha ejecutado correctamente. Revisa los logs de GitHub Actions para más detalles."
          to: ${{ secrets.GMAIL_USER }}
          from: GitHub Actions <no-reply@github.com>
